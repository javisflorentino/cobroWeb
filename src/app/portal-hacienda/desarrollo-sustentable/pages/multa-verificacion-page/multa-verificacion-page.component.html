<shared-load-spinner *ngIf="isLoading"></shared-load-spinner>
<div class="card">
  <div class="flex justify-content-center flex-wrap">
    <mat-card>
      <mat-card-header>
        <mat-card-title>Cálculo de Costos</mat-card-title>
        <mat-card-subtitle><small>{{conceptTitle | titlecase}}</small></mat-card-subtitle>
      </mat-card-header>
      <mat-divider class="mt-2 mb-2"></mat-divider>
      <mat-card-content>
        <div class="">
          <form action="" fxLayout="column"  [formGroup]="myForm" (ngSubmit)="onSubmit()">
            <div class="input-row" fxLayout="row" fxLayout.lt-md="column" fxLayoutGap="20px" fxLayoutGap.lt-md="0px">
              <mat-form-field fxFlex class="" style="margin-right:0.5em;" appearance="outline">
                <mat-label>Placa</mat-label>
                <input matInput formControlName="placa" required type="text">
                <mat-error>{{ getMessage(myForm.get('placa')?.errors,'placa') }}</mat-error>
              </mat-form-field>

              <mat-form-field fxFlex style="margin-right:0.5em;" appearance="outline">
                <mat-label>Fecha próxima verificacion </mat-label>
                <input matInput [matDatepicker]="dpff" formControlName="fecha_verificacion" [readonly]="true">
                <mat-error >No puede pagar un periodo o ejercicio fiscal que no ha pasado.</mat-error>
                <mat-datepicker-toggle matIconSuffix [for]="dpff"></mat-datepicker-toggle>
                <mat-datepicker #dpff disabled="false" panelClass="example-month-picker"></mat-datepicker>
              </mat-form-field>

              <mat-form-field fxFlex class="" style="margin-right:0.5em;" appearance="outline">
                <mat-label>No de serie</mat-label>
                <input matInput formControlName="serie" required type="text">
                <mat-error>{{ getMessageSec(myForm.get('serie')?.getError('error'),'serie') }}</mat-error>
              </mat-form-field>

            </div>
          </form>
        </div>
      </mat-card-content>

      <mat-divider></mat-divider>

      <mat-card-actions align="end">
        <div class="flex justify-content-between">
          <button mat-stroked-button color="warn" [routerLink]="['pagos/']">
            <mat-icon>cancel</mat-icon>
            Cancelar
          </button>
          <span class="spacer"></span>
          <button mat-stroked-button color="primary" [disabled]="buttBlock" (click)="onSubmit()">
            <mat-icon>calculate</mat-icon>
            Calcular
          </button>
        </div>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
