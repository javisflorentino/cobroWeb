<div class="grid flex">
  <div class="col-8">
    <mat-card>
      <mat-card-header>
        <mat-card-title>Cálculo de Costos</mat-card-title>
        <mat-card-subtitle>{{conceptTitle | uppercase}}</mat-card-subtitle>
      </mat-card-header>
      <mat-divider></mat-divider>
      <mat-card-content class="mt-3">
        <form [formGroup]="myForm">
          <form-alta-vehiculo ></form-alta-vehiculo>
          <div class="flex justify-content-between">
            <button
              mat-flat-button color="warn"
            >
              Borrar
            </button>
            <span></span>
            <button mat-flat-button color="primary" (click)="calcularPago()">
                <mat-icon>save</mat-icon>
                Calcular
            </button>
          </div>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
  <div class="col-4">
    <smyt-messages [messageArr]="messages"></smyt-messages>
  </div>
</div>

<div class="row">
  <div class="col">
    <span>Valid</span>
    <pre>{{ myForm.value | json }}</pre>
  </div>
</div>
