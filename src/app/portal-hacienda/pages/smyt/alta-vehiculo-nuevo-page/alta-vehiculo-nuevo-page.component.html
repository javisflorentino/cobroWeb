<div class="grid flex">
  <div class="col-8">
    <mat-card>
      <mat-card-header>
        <mat-card-title>Cálculo de Costos</mat-card-title>
        <mat-card-subtitle>{{conceptTitle | titlecase}}</mat-card-subtitle>
      </mat-card-header>
      <mat-divider></mat-divider>
      <mat-card-content class="mt-3">
        <form [formGroup]="myForm">
          <div class="input-row" fxLayout="row" fxLayout.lt-md="column" fxLayoutGap="20px" fxLayoutGap.lt-md="0px">
            <form-alta-vehiculo ></form-alta-vehiculo>
          </div>
        </form>
      </mat-card-content>

      <mat-divider></mat-divider>

      <mat-card-actions align="end">
        <div class="flex justify-content-between">
          <button mat-stroked-button color="warn">
            <mat-icon>cancel</mat-icon>
            Cancelar
          </button>
          <span class="spacer"></span>
          <button mat-stroked-button color="primary" (click)="calcularPago()">
            <mat-icon>calculate</mat-icon>
              Calcular
          </button>
        </div>
      </mat-card-actions>
    </mat-card>
  </div>
  <div class="col-4">
    <smyt-messages [messageArr]="messages"></smyt-messages>
  </div>
</div>
