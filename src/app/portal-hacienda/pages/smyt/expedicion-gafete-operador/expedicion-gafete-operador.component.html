<shared-load-spinner *ngIf="isLoading"></shared-load-spinner>
<div class="card">
  <div class="flex justify-content-center flex-wrap">
    <mat-card class="shadow-8">
      <mat-card-header>
        <mat-card-title>Cálculo de Costos</mat-card-title>
        <mat-card-subtitle><small>{{nameConcept | titlecase}}</small></mat-card-subtitle>
      </mat-card-header>
      <mat-divider class="mt-2 mb-2"></mat-divider>
      <mat-card-content>
        <div class="">
          <form action="" fxLayout="column" [formGroup]="expGafPubForm" (ngSubmit)="onSubmit()">
            <div class="input-row" fxLayout="row" fxLayout.lt-md="column" fxLayoutGap="20px" fxLayoutGap.lt-md="0px">
              <mat-form-field fxFlex class="" style="margin-right:0.5em;" appearance="outline">
                <mat-label>No Placa</mat-label>
                <input matInput formControlName="placa" required type="text" maxlength="8">
                <mat-error class="fontsizeerror" *ngIf="isValidField('placa')"> Campo requerido </mat-error>
              </mat-form-field>
              <mat-form-field fxFlex class="" style="margin-right:0.5em;" appearance="outline">
                <mat-label>Nombre agrupación</mat-label>
                <input matInput formControlName="agrupacion" type="text" name="" id="">
                <mat-error *ngIf="isValidField('agrupacion')">Campo requerido</mat-error>
              </mat-form-field>
              <mat-form-field fxFlex class="" style="margin-right:0.5em;" appearance="outline">
                <mat-label>Número económico</mat-label>
                <input matInput formControlName="numero_economico" type="text" name="" id="">
                <mat-error *ngIf="isValidField('numero_economico')">Campo requerido</mat-error>
              </mat-form-field>
              <!--<mat-form-field fxFlex class="col-10" appearance="outline">
                <mat-label>Oficina del trámite</mat-label>
                <mat-select formControlName="oficina" required>
                  <mat-option *ngFor="let oficina of oficinasArr" [value]="oficina.id">{{oficina.nombre}}</mat-option>
                </mat-select>
                <mat-error class="fontsizeerror" *ngIf="isValidField('oficina')"> Campo requerido </mat-error>
              </mat-form-field>-->

              <!--<mat-form-field fxFlex class="" style="margin-right:0.5em;" appearance="outline" hintLabel="">
                <mat-label>Folio Concesión </mat-label>
                <input matInput formControlName="concesion" required type="text" name="">
              </mat-form-field>-->
            </div>
          </form>
        </div>
      </mat-card-content>

      <mat-divider></mat-divider>

      <mat-card-actions align="end">
        <div class="flex justify-content-between">
          <button mat-stroked-button color="warn" [routerLink]="['/pagos/dependencias']">
            <mat-icon>cancel</mat-icon>
            Cancelar
          </button>
          <span class="spacer"></span>
          <button mat-stroked-button color="primary" [disabled]="expGafPubForm.invalid" (click)="onSubmit()">
            <mat-icon>calculate</mat-icon>
            Calcular
          </button>
        </div>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
