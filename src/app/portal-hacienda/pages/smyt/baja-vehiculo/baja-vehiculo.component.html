<shared-load-spinner *ngIf="isLoading"></shared-load-spinner>
<div class="grid flex">
  <div [ngClass]="(sizeDisplay !== 'Small' && sizeDisplay !== 'XSmall')?'col-8':'col-12'">
    <mat-card class="shadow-8">
      <mat-card-header class="mb-3">
        <mat-card-title>Cálculo de Costos</mat-card-title>
        <mat-card-subtitle>{{conceptTitle | titlecase}}</mat-card-subtitle>
      </mat-card-header>
      <mat-divider></mat-divider>
      <mat-card-content class="mt-5">
        <form [formGroup]="myForm">
          <div class="input-row" fxLayout="row" fxLayout.lt-md="column" fxLayoutGap="20px" fxLayoutGap.lt-md="0px">
            <mat-form-field fxFlex class="" style="margin-right:0.5em;" appearance="outline">
              <mat-label>No Placa</mat-label>
              <input matInput formControlName="placa" required type="text" maxlength="8">
              <mat-error > Campo requerido </mat-error>
            </mat-form-field>

            <mat-form-field fxFlex style="margin-right:0.5em;" appearance="outline">
              <mat-label>No de serie Vehicular</mat-label>
              <input matInput type="text" formControlName="no_serie">
              <mat-error> {{ getMessage(myForm.get('no_serie')?.getError('error'),'no_serie') }} </mat-error>
            </mat-form-field>
          </div>
        </form>
      </mat-card-content>

      <mat-divider></mat-divider>

      <mat-card-actions align="end">
        <div class="flex justify-content-between">
          <button mat-stroked-button color="warn" [routerLink]="['/pagos/dependencias']">
            <mat-icon>cancel</mat-icon>
            Cancelar
          </button>
          <span class="spacer"></span>
          <button mat-stroked-button color="primary" [disabled]="buttBlock" (click)="onSubmit()">
            <mat-icon>calculate</mat-icon>
              Calcular
          </button>
        </div>
      </mat-card-actions>
    </mat-card>
  </div>
  <div class="col-4" *ngIf="sizeDisplay !== 'Small' && sizeDisplay !== 'XSmall'">
    <smyt-messages [messageArr]="messages" [messageArr_other]="messages_other"></smyt-messages>
  </div>
</div>
