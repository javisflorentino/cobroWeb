<div class="grid flex">
  <div class="col-8">
    <mat-card>
      <mat-card-header>
        <mat-card-title>Cálculo de Costos</mat-card-title>
        <mat-card-subtitle>{{conceptTitle | lowercase }}</mat-card-subtitle>
      </mat-card-header>
      <mat-divider></mat-divider>
      <mat-card-content class="mt-3">
        <form [formGroup]="myForm">
          <form-alta-vehiculo ></form-alta-vehiculo>
          <div class="example-container">
            <mat-form-field appearance="outline">
              <mat-label>Modelo</mat-label>
              <input matInput type="number" formControlName="modelo">
            </mat-form-field>
            <mat-form-field #field  floatLabel="always" appearance="outline" class="full-width radio-container">
              <mat-label>Procedencia</mat-label>
              <input matInput style="display:none" required>
              <mat-radio-group #group formControlName="procedencia" class="flex-wrap" >
                <mat-radio-button #buttons value="NACIONAL">
                  <span class="wrap-label-text">Nacional</span>
                </mat-radio-button>
                <mat-radio-button #buttons value="EXTRANJERO">
                  <span class="wrap-label-text">Extranjero</span>
                </mat-radio-button>
              </mat-radio-group>
              <mat-hint>Choose something</mat-hint>
              <mat-error>ERROR °°</mat-error>
            </mat-form-field>
          </div>
          <div class="example-container">
            <mat-form-field appearance="outline">
              <mat-label>Cilindros</mat-label>
              <input matInput formControlName="cilindros" type="number" name="" id="">
            </mat-form-field>
            <mat-form-field appearance="outline">
              <mat-label>Centímetros cúbicos</mat-label>
              <input matInput formControlName="centimetros" type="number" >
            </mat-form-field>
          </div>
          <div class="flex justify-content-between">
            <button
              mat-flat-button color="warn"
            >
              Borrar
            </button>
            <span></span>
            <button mat-flat-button color="primary" (click)="calcularPago()">
                <mat-icon>save</mat-icon>
                Calcular
            </button>
          </div>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
  <div class="col-4">
    <smyt-messages [messageArr]="messages"></smyt-messages>
  </div>
</div>

<div class="row">
  <div class="col">
    <span>Valid</span>
    <pre>{{ myForm.value | json }}</pre>
  </div>


</div>
