<shared-load-spinner *ngIf="isLoading"></shared-load-spinner>
<div class="card">
  <div class="flex justify-content-center flex-wrap">
    <mat-card class="shadow-8">
      <mat-card-header>
        <mat-card-title>Busqueda Estado de Cuenta</mat-card-title>
        <mat-card-subtitle><small>{{conceptTitle | titlecase}}</small></mat-card-subtitle>

      </mat-card-header>
      <mat-divider class="mt-2 mb-2"></mat-divider>
      <mat-card-content>
        <div class="">
          <form action="" fxLayout="column"  [formGroup]="predialMunicipal" (ngSubmit)="onSubmit()">
            <div class="input-row" fxLayout="row" fxLayout.lt-md="column" fxLayoutGap="20px" fxLayoutGap.lt-md="0px">
              
              <mat-form-field fxFlex class="" style="margin-right:0.5em;" appearance="outline">
                <mat-label>Clave Catastral</mat-label>
                <input matInput formControlName="claveCatastral" required type="text" maxlength="13">
                <mat-error class="fontsizeerror"> Campo requerido </mat-error>
              </mat-form-field>

              <mat-form-field fxFlex class="" style="margin-right:0.5em;" appearance="outline" hintLabel="">
                <mat-label>Identificador</mat-label>
                <input #serie matInput formControlName="validador" required  type="text" name="" maxlength="100">
                <mat-error class="fontsizeerror"> Campo requerido </mat-error>

              </mat-form-field>
              <mat-form-field *ngIf="pkMunicipio == 5" fxFlex style="margin-right:0.5em;"  floatLabel="always" appearance="outline"
              class="full-width radio-container">
                <mat-label>Tipo de Persona</mat-label>
                <input matInput style="display:none" required>
                <mat-radio-group #group_c_tp formControlName="tipoPersona" class="flex-wrap">
                  <mat-radio-button #buttons_c_tp value="1">
                    <span class="wrap-label-text">Física</span>
                  </mat-radio-button>
                  <mat-radio-button #buttons_c_tp value="2">
                    <span class="wrap-label-text">Moral</span>
                  </mat-radio-button>
                </mat-radio-group>
            </mat-form-field>
            <mat-form-field fxFlex class="" style="margin-right:0.5em;" appearance="outline">
                <mat-label>Correo</mat-label>
                <input matInput formControlName="correo" type="text" required>
                <mat-error class="fontsizeerror">El campo no puede ir vacío</mat-error>
            </mat-form-field>
            <mat-form-field fxFlex class="" style="margin-right:0.5em;" appearance="outline">
              <mat-label>Teléfono</mat-label>
              <input matInput formControlName="telefono" type="tel" required>
              <mat-error class="fontsizeerror">El campo no puede ir vacío</mat-error>
          </mat-form-field>
            </div>
          </form>
        </div>
      </mat-card-content>

      <mat-divider></mat-divider>

      <mat-card-actions align="end">
        <div class="flex justify-content-between">
          <button mat-stroked-button color="warn" [routerLink]="['/pagos/dependencias']">
            <mat-icon>cancel</mat-icon>
            Cancelar
          </button>
          <span class="spacer"></span>
          <button mat-stroked-button color="primary" [disabled]="predialMunicipal.invalid" (click)="onSubmit()">
            <mat-icon>calculate</mat-icon>
            Buscar
          </button>
        </div>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
