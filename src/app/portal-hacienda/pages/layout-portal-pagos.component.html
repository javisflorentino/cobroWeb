<mat-sidenav-container class="layout-container" fullscreen>
  
  <!-- PANEL LATERAL (MENÚ) -->
  <shared-sidenav-conceptos 
    [reciveActionSideNav]="sendActionSidenav" 
    [valDependenciaCard]="valCardSubjectEmitt"
    [eraseLocalStor]="sendActEraseLocalStor" 
    (fathAlert)="triggerAlert($event)"
    (nameConcept)="reciveNameConcept($event)">
  </shared-sidenav-conceptos>

  <!-- BARRA SUPERIOR (HEADER) -->
  <shared-toolbar 
    [receiveNameDep]="senNameDep" 
    [viewResolution]="sizeDisplay"
    (openOrCloseSidenav)="actionOnSidenav($event)" 
    (closeLocalStor)="redirectHome($event)"
    (actionOnToolbarMenu)="activeOrInactiveToolbarMenu($event)">
  </shared-toolbar>

  <!-- CONTENIDO DINÁMICO (VISTAS) -->
  <main class="p-2">
    <shared-load-spinner *ngIf="isLoading"></shared-load-spinner>
    <router-outlet></router-outlet>
  </main>

  <!-- MENÚ FLOTANTE DE TÉRMINOS Y CONDICIONES -->
  <shared-toolbar-menu 
    *ngIf="flagActivitie"
    class="example-footer_terminos shadow-8">
  </shared-toolbar-menu>

  <!-- PIE DE PÁGINA INSTITUCIONAL -->
  <mat-toolbar 
    class="example-footer shadow-8 border-round-sm"
    [class.mat-elevation-z10]="true"
    style="background-image: url('./assets/backgroud_pleca.png'); background-position: center; background-repeat: no-repeat; background-size: 100% 100%;">
    
    <div class="centerToolbarFooter">
      <span 
        [ngStyle]="{'font-size': (sizeDisplay === 'XSmall' || sizeDisplay === 'Small') ? '13px' : '20px'}"
        style="white-space: initial; font-family: 'QuetzalSansRegular';">

        <button 
          mat-button 
          [matTooltip]="!flagActivitie ? 'Términos y Condiciones' : 'Ocultar opciones'"
          (click)="activeOrInactiveToolbarMenu(!flagActivitie)">
          <mat-icon>{{ flagActivitie ? 'keyboard_double_arrow_down' : 'keyboard_double_arrow_up' }}</mat-icon>
        </button>

      </span>
    </div>

  </mat-toolbar>

</mat-sidenav-container>
