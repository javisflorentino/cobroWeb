<mat-sidenav-container style="background-image: url('./assets/morelos_2024_desenfoque.png'); background-repeat: no-repeat; background-position: center; background-size: 40% 60%" class="layout-container" fullscreen>
  <shared-sidenav-conceptos
  [reciveActionSideNav]="sendActionSidenav"
  [valDependenciaCard]="valCardSubjectEmitt"
  [eraseLocalStor]="sendActEraseLocalStor"

    ></shared-toolbar>


  <div class="p-2">
    <!--portalhacienda-cards-dependencias *ngIf="!controlView"
        (valCardDep)="reciveValCard($event)"
        [viewResolution]="sizeDisplay" /-->

    <!--shared-load-spinner *ngIf="controlView"></!--shared-load-spinner-->

    <router-outlet></router-outlet>
  </div>
</mat-sidenav-container>
