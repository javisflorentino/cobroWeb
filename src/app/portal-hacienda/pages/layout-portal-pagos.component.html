<mat-sidenav-container class="layout-container" fullscreen>
  <shared-sidenav-conceptos [reciveActionSideNav]="sendActionSidenav" [valDependenciaCard]="valCardSubjectEmitt"
    [eraseLocalStor]="sendActEraseLocalStor" (fathAlert)="triggerAlert($event)"
    (nameConcept)="reciveNameConcept($event)"></shared-sidenav-conceptos>

  <shared-toolbar (openOrCloseSidenav)="actionOnSidenav($event)" (closeLocalStor)="redirectHome($event)"
    [receiveNameDep]="senNameDep" [viewResolution]="sizeDisplay"
    (actionOnToolbarMenu)="activeOrInactiveToolbarMenu($event)"></shared-toolbar>

  <shared-toolbar-menu style="position: fixed;  width: 100%; z-index: 2;" class="shadow-8" *ngIf="flagActivitie"></shared-toolbar-menu>




  <div class="p-2">
    <shared-load-spinner *ngIf="isLoading"></shared-load-spinner>
    <router-outlet></router-outlet>
  </div>

  <mat-toolbar class="example-footer shadow-8 border-round-sm "
    style="background-image: url('./assets/backgroud_pleca.png'); background-position: center; background-repeat: no-repeat; background-size: 100% 100%;"
    [class.mat-elevation-z10]="true">
    <div class="centerToolbarFooter">
      <span [ngStyle]="{'font-size': (sizeDisplay == 'XSmall' || sizeDisplay=='Small') ? '13px' : '20px'}"
        style="margin: auto; white-space: initial; text-align: center; font-family: 'QuetzalSansRegular';">
        <span style="font-family: 'QuetzalSansRegular';">&#169; Dirección General de Gestión de Información
          Hacendaria</span>
      </span>
    </div>
  </mat-toolbar>
</mat-sidenav-container>
