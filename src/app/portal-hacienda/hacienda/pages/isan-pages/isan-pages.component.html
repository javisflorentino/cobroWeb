<shared-load-spinner *ngIf="isLoading"></shared-load-spinner>
<div class="grid flex">
  <div [ngClass]="(sizeDisplay !== 'Small' && sizeDisplay !== 'XSmall')?'col-8':'col-12'" >
    <mat-card>
      <mat-card-header class="mb-3">
        <mat-card-title>Cálculo de Costos</mat-card-title>
        <mat-card-subtitle>{{conceptTitle | titlecase }}</mat-card-subtitle>
      </mat-card-header>
      <mat-divider></mat-divider>
      <mat-card-content class="mt-5">
        <form [formGroup]="myForm">

          <mat-form-field fxFlex class="" style="margin-right:0.5em;" appearance="outline">
            <mat-label>Monto a pagar</mat-label>
            <input matInput formControlName="monto" type="number">
            <mat-error >Requerido y numérico</mat-error>
          </mat-form-field>

          <mat-form-field fxFlex style="margin-right:0.5em;" appearance="outline">
            <mat-label>Año y Mes a pagar</mat-label>
            <input matInput [matDatepicker]="dpff" formControlName="fecha_pago" [readonly]="true" >
            <mat-error >No puede pagar un periodo o ejercicio fiscal que no ha pasado.</mat-error>
            <mat-datepicker-toggle matIconSuffix [for]="dpff"></mat-datepicker-toggle>
            <mat-datepicker #dpff disabled="false"
            startView="multi-year"
            (monthSelected)="setMonthAndYear($event, dpff)"
            panelClass="example-month-picker"
            ></mat-datepicker>
          </mat-form-field>

        </form>
      </mat-card-content>
    </mat-card>
  </div>
</div>
