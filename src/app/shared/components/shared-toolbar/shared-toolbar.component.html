<mat-toolbar class="my-toolbar" [class.mat-elevation-z10]="true">

  <div class="containerToolbar">
    <div class="leftToolbar">
      <button mat-mini-fab color="primary" (click)="redirectPagos()" class="mr-2">
        <mat-icon>home</mat-icon>
      </button>
      <button mat-mini-fab color="primary" (click)="sidenavAction()" class="mr-2">
        <mat-icon>menu</mat-icon>
      </button>

      <button mat-mini-fab color="primary" (click)="showAunHideInputSearch()">
        <mat-icon>search</mat-icon>
      </button>

      <mat-form-field appearance="fill" [style]="flagSearchTramite()?'display:inline':'display:none'"
        [ngClass]="flagSearchTramite()?'fadeinleft animation-duration-1000':'fadeinright animation-duration-1000'"
        class="wide-trigger ml-2">
        <button mat-icon-button matSuffix (click)="searchTramite()" [matMenuTriggerFor]="menu">
          <mat-icon>ads_click</mat-icon>
        </button>
        <input matInput type="text" placeholder="Buscar trámite"
          #tagInput /><!-- (keyup)="searchTramite()" [matMenuTriggerFor]="menu" #tagInput />-->
      </mat-form-field>

      <mat-menu #menu="matMenu" xPosition="before" class="my-menu">
        <shared-load-spinner *ngIf="isLoading"></shared-load-spinner>
        <ul class="list-none p-0 m-0 overflow-hidden sidenav-matnav-list">
          <div *ngIf="cardsArr.length>0; else notElement">
            <li *ngFor="let item of cardsArr"
              class="cursor-pointer p-1 hover:surface-700 transition-duration-150 transition-colors sidenav-matnav-ul-li"
              routerLinkActive="active"
              (click)="redirectToTramite(item.url,item.idConcepto,item.formulario,item.gestora,item.tipoMovimiento)">
              <div class="grid">
                <div class="col-10">
                  <div class="p-1"><span class="text-sm">{{item.titulo}}</span></div>
                </div>
              </div>
            </li>

          </div>
          <ng-template #notElement>
            No se encontró informacion con la palabra ingresada, por favor ingresa otro parámetro
          </ng-template>
        </ul>
      </mat-menu>

    </div>
    <div class="centerToolbar">
      <span [ngStyle]="{'font-size': (viewResolution == 'XSmall' || viewResolution=='Small') ? '13px' : '17px'}"
        style="margin: auto; white-space: initial; text-align: center; font-family: 'QuetzalSansRegular';">
        <span style="font-family: 'QuetzalSansRegular';">FINANZAS DIGITAL MORELOS</span>
        <br>
        <span class="text-600" style="font-family: 'QuetzalSansThin';">{{receiveNameDep}}</span>
        <br>

      </span>
    </div>
    <div class="rightToolbar">
      <div class="flex flex-wrap align-items-center justify-content-center">
        <div class="bg-center sm:bg-center bg-no-repeat w-15rem h-4rem"
          style="background-image: url('./assets/Hacienda-Header-Izquierdo.png');background-size: 10rem"></div>
      </div>
    </div>
  </div>

</mat-toolbar>
