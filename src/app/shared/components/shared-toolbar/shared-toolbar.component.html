<mat-toolbar class="my-toolbar" color="primary" [class.mat-elevation-z10]="true" style="background-image: url('./assets/backgroud_pleca.png'); background-position: center; background-repeat: no-repeat; background-size: 100% 100%;">
  <button mat-mini-fab color="primary" (click)="redirectPagos()">
    <mat-icon>home</mat-icon>
  </button>
  <button mat-mini-fab color="primary" (click)="sidenavAction()">
    <mat-icon>menu</mat-icon>
  </button>
  <span [ngStyle]="{'font-size': (viewResolution == 'XSmall' || viewResolution=='Small') ? '13px' : '20px'}"
    style="margin: auto; white-space: initial; text-align: center; font-family: 'QuetzalSansRegular';">
    <span style="font-family: 'QuetzalSansRegular';">HACIENDA DIGITAL MORELOS</span>
    <br>
    <span class="text-600" style="font-family: 'QuetzalSansThin';">{{receiveNameDep}}</span>
  </span><!--{{nameConceptToolbar | titlecase}}</span-->
  <span></span>

  <mat-form-field [style]="flagSearchTramite()?'display:inline':'display:none'"
    [ngClass]="flagSearchTramite()?'fadeinright animation-duration-1000':'fadeinleft animation-duration-1000'" class="wide-trigger">
    <input matInput type="text" placeholder="Busca el támite" #tagInput />
    <button mat-icon-button matSuffix (click)="searchTramite()" [matMenuTriggerFor]="menu">
      <mat-icon>ads_click</mat-icon>
    </button>
  </mat-form-field>

  <mat-menu #menu="matMenu" xPosition="before" class="my-menu">
    <shared-load-spinner *ngIf="isLoading"></shared-load-spinner>
    <ul class="list-none p-0 m-0 overflow-hidden sidenav-matnav-list">
      <div *ngIf="cardsArr.length>0; else notElement">
        <li *ngFor="let item of cardsArr"
          class="cursor-pointer p-1 hover:surface-700 transition-duration-150 transition-colors sidenav-matnav-ul-li"
          routerLinkActive="active" (click)="redirectToTramite(item.url,item.idConcepto,item.formulario,item.gestora,item.tipoMovimiento)">
          <div class="grid">
            <div class="col-10">
              <div class="p-1"><span class="text-sm">{{item.titulo}}</span></div>
            </div>
          </div>
        </li>

      </div>
      <ng-template #notElement>
        No se encontró informacion con la palabra ingresada, por favor ingresa otro parámetro
      </ng-template>
    </ul>
  </mat-menu>
  <button mat-mini-fab color="primary" [style]="flagSearchTramite()" (click)="showAunHideInputSearch()">
    <mat-icon>search</mat-icon>
  </button>


</mat-toolbar>
