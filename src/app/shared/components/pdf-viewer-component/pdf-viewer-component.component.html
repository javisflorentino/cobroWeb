<div class="pdf-viewer-container">
      <div class="pdf-header">
        <h2 mat-dialog-title>{{ data.titulo || 'Documento PDF' }}</h2>
        <div class="pdf-actions">
          <button mat-raised-button 
                  color="primary" 
                  *ngIf="data.mostrarBotonPago && data.estadoCuentaData"
                  (click)="procederPago()" 
                  class="btn-pago">
            <mat-icon>payment</mat-icon>
            Proceder al Pago
          </button>
          <button mat-icon-button (click)="descargarPDF()" title="Descargar PDF">
            <mat-icon>download</mat-icon>
          </button>
          <button mat-icon-button (click)="cerrar()" title="Cerrar">
            <mat-icon>close</mat-icon>
          </button>
        </div>
      </div>
      
      <div class="pdf-content">
        <iframe 
          [src]="data.pdfUrl" 
          width="100%" 
          height="100%" 
          frameborder="0">
        </iframe>
      </div>
    </div>
