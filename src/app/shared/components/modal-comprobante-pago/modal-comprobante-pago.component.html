<!-- payment-dialog.component.html -->
<div class="dialog-container"

style="background-image: url('./assets/fondoLogo.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center">
    <h2  class="dialog-titulo">Comprobante de Pago</h2>
    <p class="dialog-subtitle">Introduzca la línea de captura o 
        código de reimpresión</p>
    
    <mat-dialog-content>
      <form [formGroup]="paymentForm">
        <div class="form-field">
          <label class="text-center">Línea Captura</label>
          <mat-form-field appearance="outline" class="full-width">
            <input matInput formControlName="captureLine">
          </mat-form-field>
        </div>
        
       
        
        <div *ngIf="captureLineInvalid" class="error-message">
          Línea de captura no válida
        </div>
      </form>
    </mat-dialog-content>
    
    <mat-dialog-actions align="center">
      <button mat-raised-button color="primary" class="search-button" (click)="search()">
        Buscar
      </button>
    </mat-dialog-actions>
  </div>
