<mat-sidenav [ngStyle]="{width: '350px'}" #sidenav mode="push" style="z-index:101;">

  <mat-toolbar color="primary" [class.mat-elevation-z5]="true">
    <span>Menú</span>
    <span class="spacer"></span>
    <button mat-icon-button (click)="sidenav.toggle()">
      <mat-icon>menu</mat-icon>
    </button>
  </mat-toolbar>

  <mat-nav-list>

    <mat-list-item *ngFor="let item of itemsConceptos">
      <div matListItemLine routerLinkActive="active"  (click)="actionList(item.url,item.textoTitulo)">
        {{item.textoTitulo}}
      </div>
    </mat-list-item>
    <mat-divider #divider></mat-divider>

  </mat-nav-list>

</mat-sidenav>
