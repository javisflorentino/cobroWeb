<mat-sidenav [ngStyle]="{width: '350px'}" #sidenav mode="push" class="matsidenav">
  <shared-load-spinner *ngIf="isLoading"></shared-load-spinner>
  
  <mat-toolbar class="my-toolbar-sidenav" [class.mat-elevation-z3]="true">
    <button mat-icon-button *ngIf="showBack" (click)="backMenu()">
      <mat-icon style="color: #CBCABE;">arrow_back</mat-icon>
    </button>
    <span class="spacer"></span>
    <span style="font-family: QuetzalSansThin; letter-spacing: 1px;">MENÚ</span>
    <span class="spacer"></span>
    <button mat-icon-button (click)="sidenav.toggle()">
      <mat-icon style="color: #CBCABE;">menu</mat-icon>
    </button>
  </mat-toolbar>

  <mat-nav-list>
    <ul class="sidenav-matnav-list">
      
      <!-- Listado de Conceptos en formato Bullet -->
      <li *ngFor="let item of itemsConceptos"
          class="cursor-pointer sidenav-matnav-ul-li"
          routerLinkActive="active"
          (click)="actionList(item.url, item.titulo, item.pk, item.idConcepto, item.pk, item.gestora, item.tipoMovimiento)">
        
        <div class="flex align-items-center justify-content-between" style="display: flex; justify-content: space-between; align-items: center;">
          <span class="text-sm font-medium pr-2">{{item.titulo}}</span>
          <mat-icon *ngIf="item.gestora == 0" class="nav-icon-accent">navigate_next</mat-icon>
        </div>
        
      </li>

      <!-- Alerta informativa (Gris / Terracota) -->
      <div *ngIf="showMessage" class="mt-3 px-2">
        <div class="alert-container-warn">
          <i class="pi pi-info-circle mr-2"></i>
          Seleccione alguna de las dependencias para mostrar las opciones.
        </div>
      </div>

      <!-- Alerta de Error (Vino) -->
      <div *ngIf="showMessage_errReq" class="mt-3 px-2">
        <div class="alert-container-error">
          <i class="pi pi-exclamation-triangle mr-2"></i>
          No se encontraron registros, comuníquese con soporte.
        </div>
      </div>

    </ul>
  </mat-nav-list>
</mat-sidenav>
